@let selectedApplication = selectedApplication$ | async;
<div class="container">
  <div class="header-container">
    <div class="app-title">
      <tui-avatar [src]="selectedApplication?.iconUrl" size="l">
        {{ selectedApplication?.parameters?.name }}
      </tui-avatar>
      <h2>{{ selectedApplication?.parameters?.name }}</h2>
    </div>
    <tui-segmented size="l">
      <a routerLinkActive [routerLinkActiveOptions]="options" routerLink="./config">
        Конфигурация
      </a>
      <a routerLinkActive [routerLinkActiveOptions]="options" routerLink="./providers">
        Провайдеры
      </a>
      <a routerLinkActive [routerLinkActiveOptions]="options" routerLink="./tokens">
        Токены
      </a>
      <a routerLinkActive [routerLinkActiveOptions]="options" routerLink="./subscriptions">
        Подписки
      </a>
      <a routerLinkActive [routerLinkActiveOptions]="options" routerLink="./users">
        Пользователи
      </a>
    </tui-segmented>
  </div>
  <tui-scrollbar>
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </tui-scrollbar>
</div>
